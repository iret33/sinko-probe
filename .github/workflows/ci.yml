name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run Pytest
        run: pytest -v
      - name: CLI smoke test
        run: |
          sinko-probe --version
          sinko-probe list-profiles

  minimum-versions:
    # Proves the lower bounds in pyproject.toml are real.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - name: Install the oldest supported dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "dnspython==2.6.1" "httpx[http2]==0.27.0" "pydantic==2.7.0" \
            "pyyaml==6.0.1" "rich==13.7.1" "typer==0.13.0" \
            "pytest==8.2.0" "pytest-asyncio==0.23.6" "trustme==1.1.0"
          pip install --no-deps -e .
      - name: Run Pytest
        run: pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build image
        run: docker build -t sinko-probe:ci .
      - name: Smoke test image
        run: |
          docker run --rm sinko-probe:ci --version
          docker run --rm sinko-probe:ci list-profiles
